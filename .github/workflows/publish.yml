name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can push the rendered site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up uv
        # setup-uv publishes no floating major tag past v7.x, so pin exactly.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      # Put the project venv on PATH so Quarto finds jupyter when a post
      # has code cells that are not already frozen in _freeze/.
      - name: Activate venv
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
